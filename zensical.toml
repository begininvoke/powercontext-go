[project]
site_name = "PowerContext Go"
site_url = "https://ob-labs.github.io/powercontext-go"
site_description = "The Go implementation of PowerContext."
site_author = "PowerContext Team"
repo_url = "https://github.com/ob-labs/powercontext-go"
repo_name = "ob-labs/powercontext-go"
edit_uri = "edit/main/docs/"
copyright = 'Maintained by <a href="https://oceanbase.com">OceanBase</a>.'

nav = [
    { "Overview" = "index.md" },
    { "Architecture" = "architecture/README.md" },
    { "Architecture decisions" = [
        { "Overview" = "adr/README.md" },
        { "Mistral transport" = "adr/0001-mistral-go-transport.md" },
        { "Internal product packages" = "adr/0002-internal-product-packages.md" },
    ] },
    { "RFCs" = "rfcs/README.md" },
    { "Release installation" = "release/INSTALL.md" },
]

[project.plugins.search]
lang = ["en"]

[project.theme]
language = "en"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.path",
    "navigation.top",
    "search.highlight",
]

[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ob-labs/powercontext-go"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.toc]
permalink = true
