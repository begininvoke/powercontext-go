name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run checks
        run: make check

      - name: Check OpenAPI contract
        run: make contract-test

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run unit tests
        run: make unit-test

      - name: Run end-to-end tests
        run: make e2e-test

  pi-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up project tools
        uses: jdx/mise-action@v2

      - name: Test Pi package
        run: make pi-test

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.10.12"
          enable-cache: true
          cache-dependency-glob: tools/docs/uv.lock

      - name: Set up the documentation environment
        run: make docs-sync

      - name: Check if documentation can be built
        run: make docs-test
