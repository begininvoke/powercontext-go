name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  binaries:
    name: Binary archives (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.34.5"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: integrations/dsh/plugins/powercontext/pnpm-lock.yaml

      - name: Resolve immutable release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          version="${RELEASE_TAG#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "invalid release version" >&2; exit 2 ;;
          esac
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          epoch="$(git show -s --format=%ct "$commit")"
          build_date="$(python3 -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$epoch")"
          target="$(go env GOOS)-$(go env GOARCH)"
          test "$target" = "$EXPECTED_TARGET"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Build the DSH runtime adapter
        working-directory: integrations/dsh/plugins/powercontext
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build and verify Vec1
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          url="$(go run ./tools/release asset -component vec1 -field url)"
          expected="$(go run ./tools/release asset -component vec1 -field sha256)"
          mkdir -p "$RUNNER_TEMP/native"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/native/vec1.c" "$url"
          go run ./tools/release verify -sha256 "$expected" "$RUNNER_TEMP/native/vec1.c"
          case "$RUNNER_OS" in
            Linux)
              extra=""
              if [ "$TARGET" = linux-arm64 ]; then extra="-flax-vector-conversions"; fi
              gcc -O2 -fPIC -shared $extra -o "$RUNNER_TEMP/native/vec1.so" "$RUNNER_TEMP/native/vec1.c" -lm
              vec1="$RUNNER_TEMP/native/vec1.so"
              ;;
            macOS)
              extra=""
              if [ "$TARGET" = darwin-arm64 ]; then extra="-flax-vector-conversions"; fi
              sdk="$(xcrun --show-sdk-path)"
              clang -O2 -fPIC -dynamiclib -undefined dynamic_lookup $extra \
                -I"$sdk/usr/include" -o "$RUNNER_TEMP/native/vec1.dylib" "$RUNNER_TEMP/native/vec1.c"
              vec1="$RUNNER_TEMP/native/vec1.dylib"
              ;;
            *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 2 ;;
          esac
          echo "VEC1_EXTENSION=$vec1" >> "$GITHUB_ENV"

      - name: Download and verify the native tokenizer library
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          url="$(go run ./tools/release asset -component tokenizers -target "$TARGET" -field url)"
          expected="$(go run ./tools/release asset -component tokenizers -target "$TARGET" -field sha256)"
          mkdir -p "$RUNNER_TEMP/tokenizers"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tokenizers.tar.gz" "$url"
          go run ./tools/release verify -sha256 "$expected" "$RUNNER_TEMP/tokenizers.tar.gz"
          tar -xzf "$RUNNER_TEMP/tokenizers.tar.gz" -C "$RUNNER_TEMP/tokenizers" libtokenizers.a
          echo "TOKENIZERS_LIB_DIR=$RUNNER_TEMP/tokenizers" >> "$GITHUB_ENV"

      - name: Acquire verified ONNX Runtime
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/onnxruntime/lib"
          from_source="$(go run ./tools/release asset -component onnxruntime -target "$TARGET" -field build-from-source)"
          if [ "$from_source" = true ]; then
            commit="$(go run ./tools/release asset -component onnxruntime -field commit)"
            build_root="$RUNNER_TEMP/onnxruntime-build"
            git init "$RUNNER_TEMP/onnxruntime-source"
            git -C "$RUNNER_TEMP/onnxruntime-source" remote add origin https://github.com/microsoft/onnxruntime.git
            git -C "$RUNNER_TEMP/onnxruntime-source" fetch --depth=1 origin "$commit"
            git -C "$RUNNER_TEMP/onnxruntime-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/onnxruntime-source" rev-parse HEAD)" = "$commit"
            "$RUNNER_TEMP/onnxruntime-source/build.sh" \
              --config Release --build_shared_lib --parallel --skip_tests \
              --build_dir "$build_root" \
              --compile_no_warning_as_error \
              --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64
            test -f "$build_root/Release/CMakeCache.txt"
            cmake --install "$build_root/Release" --prefix "$RUNNER_TEMP/onnxruntime"
          else
            url="$(go run ./tools/release asset -component onnxruntime -target "$TARGET" -field url)"
            expected="$(go run ./tools/release asset -component onnxruntime -target "$TARGET" -field sha256)"
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/onnxruntime.tgz" "$url"
            go run ./tools/release verify -sha256 "$expected" "$RUNNER_TEMP/onnxruntime.tgz"
            mkdir -p "$RUNNER_TEMP/onnxruntime-extract"
            tar -xzf "$RUNNER_TEMP/onnxruntime.tgz" -C "$RUNNER_TEMP/onnxruntime-extract"
            source_lib="$(find "$RUNNER_TEMP/onnxruntime-extract" -type d -name lib -print -quit)"
            test -n "$source_lib"
            cp -a "$source_lib/." "$RUNNER_TEMP/onnxruntime/lib/"
          fi
          test -n "$(find "$RUNNER_TEMP/onnxruntime/lib" -type f -name 'libonnxruntime*' -print -quit)"
          echo "ONNXRUNTIME_LIB_DIR=$RUNNER_TEMP/onnxruntime/lib" >> "$GITHUB_ENV"

      - name: Install the pinned SBOM generator
        run: |
          version="$(go run ./tools/release asset -component syft -field version)"
          mkdir -p "$RUNNER_TEMP/tools"
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/anchore/syft/cmd/syft@v$version"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Build and package both editions
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          BUILD_DATE: ${{ steps.release.outputs.build_date }}
          SYFT: ${{ runner.temp }}/tools/syft
        run: |
          make package-standard
          make package-full
          go run ./tools/release checksum -output "dist/SHA256SUMS-${{ steps.release.outputs.target }}" \
            dist/*.tar.gz dist/*.spdx.json

      - name: Upload platform release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.release.outputs.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  images:
    name: Multi-platform OCI images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          epoch="$(git show -s --format=%ct "$commit")"
          build_date="$(python3 -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.argv[1]), datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$epoch")"
          image_owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
            echo "standard=ghcr.io/$image_owner/powercontext:$version"
            echo "full=ghcr.io/$image_owner/powercontext-full:$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the standard image
        id: standard
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: powercontext
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.standard }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=powercontext-standard
          cache-to: type=gha,mode=max,scope=powercontext-standard

      - name: Build and push the Full image
        id: full
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: powercontext-full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.full }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=powercontext-full
          cache-to: type=gha,mode=max,scope=powercontext-full

      - name: Record immutable image digests
        env:
          STANDARD_IMAGE: ${{ steps.metadata.outputs.standard }}
          STANDARD_DIGEST: ${{ steps.standard.outputs.digest }}
          FULL_IMAGE: ${{ steps.metadata.outputs.full }}
          FULL_DIGEST: ${{ steps.full.outputs.digest }}
        run: |
          mkdir -p image-release
          jq -n \
            --arg standard "$STANDARD_IMAGE@$STANDARD_DIGEST" \
            --arg full "$FULL_IMAGE@$FULL_DIGEST" \
            '{schema_version: 1, sbom_attestations: true, images: {standard: $standard, full: $full}}' \
            > image-release/IMAGE-DIGESTS.json

      - name: Upload image digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-images
          path: image-release/IMAGE-DIGESTS.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach checksummed release assets
    needs: [binaries, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Build the release-level checksum manifest
        run: |
          go run ./tools/release checksum -output dist/SHA256SUMS \
            dist/*.tar.gz dist/*.spdx.json dist/IMAGE-DIGESTS.json
          test "$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')" = 8
          test "$(find dist -name '*.spdx.json' | wc -l | tr -d ' ')" = 8

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/IMAGE-DIGESTS.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
